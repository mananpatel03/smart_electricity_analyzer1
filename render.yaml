services:
  - type: web
    name: voltwise-energy-analyzer
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: voltwise-db
          property: connectionString

databases:
  - name: voltwise-db
    databaseName: voltwise
    user: voltwise_user
    plan: free
